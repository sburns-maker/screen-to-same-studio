name: Natural calls and photos
on:
  pull_request:
    paths:
      - "src/lib/phone-calls.server.ts"
      - "src/lib/world.server.ts"
      - "src/lib/photo-opportunities.ts"
      - "src/lib/tess.functions.ts"
      - ".github/workflows/natural-calls-photos.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/photo-pacing.test.ts src/test/photo-opportunities.test.ts
      - run: bun run build
