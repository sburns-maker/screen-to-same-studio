name: Natural calls and photos
on:
  pull_request:
    paths:
      - "src/lib/phone-calls.server.ts"
      - "src/lib/phone-calls.functions.ts"
      - "src/lib/call-readiness.server.ts"
      - "src/components/CallsDebug.tsx"
      - "src/test/calls-debug.test.tsx"
      - "src/test/phone-calls.integration.test.ts"
      - "src/test/live-calls.test.ts"
      - "src/lib/live-call-request.ts"
      - "src/test/live-call-request.test.ts"
      - "src/test/live-call-start.test.ts"
      - "src/test/incoming-call.test.tsx"
      - "src/lib/live-calls.ts"
      - "src/lib/live-calls.functions.ts"
      - "src/components/IncomingCall.tsx"
      - "src/routes/_authenticated/live-call.$conversationId.tsx"
      - "src/test/voice-defaults.test.ts"
      - "src/test/voice-provider-config.test.ts"
      - "src/lib/voice-provider.server.ts"
      - "src/lib/call-readiness.server.ts"
      - "src/lib/world.server.ts"
      - "src/lib/photo-opportunities.ts"
      - "src/lib/api18-reference-library.ts"
      - "src/lib/api18-image.server.ts"
      - "src/test/api18-reference-library.test.ts"
      - "src/lib/photo-policy.ts"
      - "src/lib/photo-policy.ts"
      - "src/lib/photo-composition.ts"
      - "src/test/photo-variety.test.ts"
      - "src/lib/photo-personality.ts"
      - "src/lib/tess-image.server.ts"
      - "src/test/photo-policy.test.ts"
      - "src/test/photo-personality.test.ts"
      - "src/lib/tess.functions.ts"
      - ".github/workflows/natural-calls-photos.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/photo-pacing.test.ts src/test/photo-opportunities.test.ts src/test/photo-policy.test.ts src/test/photo-personality.test.ts src/test/photo-variety.test.ts src/test/photo-turn.test.ts src/test/tess-image.test.ts src/test/api18-reference-library.test.ts
      - run: bunx tsc --noEmit
      - run: bunx vitest run src/test/live-call-request.test.ts src/test/live-call-start.test.ts src/test/incoming-call.test.tsx src/test/live-calls.test.ts src/test/voice-provider-config.test.ts src/test/voice-defaults.test.ts src/test/phone-calls.integration.test.ts src/test/calls-debug.test.tsx
      - run: bun run build
