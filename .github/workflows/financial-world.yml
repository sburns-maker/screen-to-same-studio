name: Private billionaire economy
on:
  pull_request:
    paths:
      - "drizzle/migrations/0080_private_wealth_economy.sql"
      - "drizzle/migrations/0081_financial_management.sql"
      - "drizzle/migrations/0082_financial_investments.sql"
      - "drizzle/migrations/0083_employee_salary_notices.sql"
      - "src/lib/finance*"
      - "src/routes/_authenticated/finances.tsx"
      - "src/components/FinanceManagement.tsx"
      - "src/components/FinanceInvestments.tsx"
      - "src/test/finance.test.ts"
      - "src/test/finance-knowledge.test.ts"
      - "src/test/fixtures/finance/**"
      - ".github/workflows/financial-world.yml"
  workflow_dispatch:
jobs:
  finance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: finance_test
    steps:
      - uses: actions/checkout@v4
      - name: Execute finance migration and assert transactional invariants
        run: |
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/setup.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0080_private_wealth_economy.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0081_financial_management.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/management-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0082_financial_investments.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/investment-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0083_employee_salary_notices.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/salary-checks.sql
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run finance unit tests
        run: bunx vitest run src/test/finance.test.ts src/test/finance-knowledge.test.ts
