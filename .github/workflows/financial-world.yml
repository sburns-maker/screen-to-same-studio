name: Private billionaire economy
on:
  pull_request:
    paths:
      - "drizzle/migrations/0080_private_wealth_economy.sql"
      - "drizzle/migrations/0081_financial_management.sql"
      - "drizzle/migrations/0082_financial_investments.sql"
      - "drizzle/migrations/0083_employee_salary_notices.sql"
      - "drizzle/migrations/0084_hands_off_ownership.sql"
      - "drizzle/migrations/0085_optional_equity_offers.sql"
      - "drizzle/migrations/0086_finance_agreements_and_equity.sql"
      - "drizzle/migrations/0087_editable_finance_agreements.sql"
      - "drizzle/migrations/0088_photography_studio_ventures.sql"
      - "drizzle/migrations/0089_photography_studio_bookings.sql"
      - "drizzle/migrations/0090_rental_property_management.sql"
      - "src/lib/finance*"
      - "src/routes/_authenticated/finances.tsx"
      - "src/components/FinanceManagement.tsx"
      - "src/components/RentalPropertyManagement.tsx"
      - "src/components/FinanceGovernance.tsx"
      - "src/components/FinanceLegalReview.tsx"
      - "src/components/EditableFinanceAgreement.tsx"
      - "src/components/FinanceInvestments.tsx"
      - "src/components/PhotographyStudioVentures.tsx"
      - "src/components/PhotographyStudioBookings.tsx"
      - "src/test/finance.test.ts"
      - "src/test/finance-knowledge.test.ts"
      - "src/test/fixtures/finance/**"
      - ".github/workflows/financial-world.yml"
  workflow_dispatch:
jobs:
  finance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: finance_test
    steps:
      - uses: actions/checkout@v4
      - name: Execute finance migration and assert transactional invariants
        run: |
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/setup.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0080_private_wealth_economy.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0081_financial_management.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/management-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0082_financial_investments.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/investment-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0083_employee_salary_notices.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/salary-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0084_hands_off_ownership.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0085_optional_equity_offers.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/governance-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0086_finance_agreements_and_equity.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/equity-finalization-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0087_editable_finance_agreements.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/editable-agreement-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0088_photography_studio_ventures.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/photography-venture-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0089_photography_studio_bookings.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/photography-bookings-checks.sql
          psql -v ON_ERROR_STOP=1 -f drizzle/migrations/0090_rental_property_management.sql
          psql -v ON_ERROR_STOP=1 -f src/test/fixtures/finance/rental-checks.sql
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run finance unit tests
        run: bunx vitest run src/test/finance.test.ts src/test/finance-knowledge.test.ts src/test/finance-character-decisions.test.ts
      - name: Verify TypeScript
        run: bunx tsc --noEmit
      - name: Verify production build
        run: bun run build
