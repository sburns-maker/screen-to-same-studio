name: General Travel
on:
  pull_request:
    paths:
      - "src/lib/travel-experiences.ts"
      - "src/test/travel-experiences.test.ts"
      - "src/test/travel-photos.test.ts"
      - "src/test/travel-places.test.ts"
      - "src/lib/travel-places.ts"
      - "src/lib/travel.functions.ts"
      - "src/lib/travel-ai.server.ts"
      - "src/lib/travel-photos.server.ts"
      - "src/lib/travel-world.server.ts"
      - "src/lib/travel-memory.server.ts"
      - "src/lib/world.server.ts"
      - "src/lib/tess.functions.ts"
      - "src/routes/_authenticated/travel.tsx"
      - "src/routes/_authenticated/plans.tsx"
      - "docs/sql/20261024_travel_trips.sql"
      - ".github/workflows/general-travel.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/travel-experiences.test.ts src/test/travel-milestones.test.ts src/test/travel-photos.test.ts src/test/travel-places.test.ts
      - run: bun run build
