name: Living Experience PostgreSQL transactions
on:
  pull_request:
    paths:
      - 'drizzle/migrations/**'
      - 'src/lib/*experience*'
      - 'src/test/experience-postgres.test.ts'
      - 'vitest.postgres.config.ts'
      - '.github/workflows/experience-postgres.yml'
  workflow_dispatch:
jobs:
  transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phase6_tests
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d phase6_tests" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Install only the PostgreSQL test dependencies in a temporary Bun project.
      # Avoid npm's Arborist installer issue on hosted runners.
      - name: Install isolated PostgreSQL test dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/phase6-postgres"
          printf '%s\n' '{"name":"phase6-postgres-ci","version":"1.0.0","private":true,"devDependencies":{"vitest":"4.1.11","postgres":"3.4.9"}}' > "$RUNNER_TEMP/phase6-postgres/package.json"
          bun install --cwd "$RUNNER_TEMP/phase6-postgres" --ignore-scripts
          ln -s "$RUNNER_TEMP/phase6-postgres/node_modules" node_modules
      - name: Test real PostgreSQL transactions
        run: ./node_modules/.bin/vitest run --config vitest.postgres.config.ts
        env:
          PHASE6_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/phase6_tests
