name: Living Experience PostgreSQL transactions
on:
  pull_request:
    paths:
      - 'drizzle/migrations/**'
      - 'src/lib/*experience*'
      - 'src/test/experience-postgres.test.ts'
      - '.github/workflows/experience-postgres.yml'
  workflow_dispatch:
jobs:
  transactions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: phase6_tests
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/test/experience-postgres.test.ts
        env:
          PHASE6_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/phase6_tests
