name: Experience retry recovery
on:
  pull_request:
    paths:
      - "src/routes/_authenticated/experiences.tsx"
      - "src/lib/experience-provider-check.server.ts"
      - "src/components/LivingExperiencesDebug.tsx"
      - "src/test/experience-provider-check*.test*"
      - "src/lib/character-ai-error.ts"
      - "src/lib/text-ai.server.ts"
      - "src/lib/experience-failure.ts"
      - "src/lib/living-experiences.server.ts"
      - "src/lib/living-experiences.ts"
      - "src/lib/in-person-output-rules.ts"
      - "src/lib/tess.server.ts"
      - "src/test/in-person-output-rules.test.ts"
      - "src/test/experience-guidance.test.ts"
      - "src/test/experience-history-window.test.ts"
      - "src/test/text-ai.test.ts"
      - "src/test/experience-failure.test.ts"
      - "src/test/experience-ui.test.tsx"
      - "src/lib/living-experiences.functions.ts"
      - "drizzle/migrations/0034_experience_retry_recovery.sql"
      - ".github/workflows/experience-retry-recovery.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/experience-provider-check.test.ts src/test/experience-provider-check-ui.test.tsx src/test/text-ai.test.ts src/test/experience-failure.test.ts src/test/experience-ui.test.tsx src/test/experience-lifecycle.test.ts src/test/living-experiences.integration.test.ts src/test/experience-guidance.test.ts src/test/experience-history-window.test.ts src/test/in-person-output-rules.test.ts
      - run: bunx tsc --noEmit
      - run: bun run build
