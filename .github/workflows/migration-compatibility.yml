name: Migration history compatibility
on:
  pull_request:
    paths:
      - "drizzle/migrations/**"
      - "scripts/build-migration-compat.mjs"
      - "scripts/migration-compat/**"
      - "src/test/migration-compatibility*"
      - "src/test/migration-comment-variants.ts"
      - "vitest.migration-compat.config.ts"
      - ".github/workflows/migration-compatibility.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: migration_compat_tests
          POSTGRES_PASSWORD: local-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_compat_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: node scripts/build-migration-compat.mjs --check
      - run: bunx vitest run src/test/migration-compatibility.test.ts
      - run: bunx vitest run --config vitest.migration-compat.config.ts
        env:
          MIGRATION_COMPAT_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/migration_compat_tests
      - run: bunx tsc --noEmit
      - run: bun run build
