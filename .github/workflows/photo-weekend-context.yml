name: Everyday photo context
on:
  pull_request:
    paths:
      - "src/lib/calendar-commitment.ts"
      - "src/lib/world.server.ts"
      - "src/lib/tess.functions.ts"
      - "src/lib/tess.server.ts"
      - "src/lib/photo-activity.ts"
      - "src/lib/photo-opportunities.ts"
      - "src/lib/photo-delivery.server.ts"
      - "src/lib/photo-decision-details.ts"
      - "src/lib/world-runtime.server.ts"
      - "src/test/photo-*.test.ts"
      - "src/test/world-offline.integration.test.ts"
      - "src/test/photo-context-weekend.test.ts"
      - ".github/workflows/photo-weekend-context.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx vitest run src/test/photo-context-weekend.test.ts src/test/calendar-commitment.test.ts src/test/photo-turn.test.ts src/test/photo-opportunities.test.ts src/test/photo-decision-details.test.ts src/test/photo-reservation.test.ts src/test/photo-test-status.test.ts src/test/world-offline.integration.test.ts
      - run: bun run build
