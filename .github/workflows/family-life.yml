name: Family life foundation verification
on:
  push:
    branches:
      - feature/family-life-foundation
  pull_request:
    paths:
      - 'src/lib/family-*'
      - 'src/lib/relationship-commitments.ts'
      - 'src/components/ContactRelationshipStory.tsx'
      - 'src/integrations/supabase/types.ts'
      - 'supabase/migrations/*family*'
      - '.github/workflows/family-life.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/family-life.test.ts src/lib/family-wedding-actions.test.ts src/lib/family-wedding-ceremony.test.ts src/lib/family-encounter-actions.test.ts
      - if: success() || failure()
        run: bunx tsc --noEmit
      - if: success() || failure()
        run: bun run build

  merge-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check merge against current main without changing the branch
        shell: bash
        run: |
          git fetch origin main
          if ! git -c user.name=merge-check -c user.email=merge-check@example.invalid merge --no-commit --no-ff origin/main; then
            echo "::error::The family-life branch conflicts with main. Resolve these paths:"
            git diff --name-only --diff-filter=U
            git merge --abort || true
            exit 1
          fi
          git merge --abort || true
