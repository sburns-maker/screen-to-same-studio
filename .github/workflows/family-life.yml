name: Family life foundation verification
on:
  pull_request:
    paths:
      - 'src/lib/family-*'
      - 'src/lib/relationship-commitments.ts'
      - 'src/components/ContactRelationshipStory.tsx'
      - 'src/integrations/supabase/types.ts'
      - 'supabase/migrations/*family*'
      - '.github/workflows/family-life.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/family-life.test.ts src/test/housing.integration.test.ts
      - run: bunx tsc --noEmit
      - run: bun run build
