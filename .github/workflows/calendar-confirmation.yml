name: Calendar confirmation checks
on:
  pull_request:
    paths:
      - "src/lib/calendar-logic.ts"
      - "src/test/calendar-logic.test.ts"
      - ".github/workflows/calendar-confirmation.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/calendar-logic.test.ts
      - run: bun run build
